<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 460" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>MINALIA composition pattern: how cross-module calls work via plain helpers</title>
  <desc>Two plain helper functions (performUnitTransfer and ledger.record) that are not @runtimeMethods. They are called only from other modules' methods, never from chain transactions directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t  { font-size: 14px; font-weight: 400; fill: #444441; }
    .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .col-h { font-size: 14px; font-weight: 500; fill: #444441; }
    .coral-fill { fill: #FAECE7; stroke: #993C1D; }
    .coral-th   { fill: #712B13; }
    .coral-ts   { fill: #993C1D; }
    .purple-fill{ fill: #EEEDFE; stroke: #534AB7; }
    .purple-th  { fill: #3C3489; }
    .purple-ts  { fill: #534AB7; }
    .amber-fill { fill: #FAEEDA; stroke: #BA7517; }
    .amber-th   { fill: #633806; }
    .amber-ts   { fill: #854F0B; }
    .teal-fill  { fill: #E1F5EE; stroke: #0F6E56; }
    .teal-th    { fill: #085041; }
    .teal-ts    { fill: #0F6E56; }
    .gray-fill  { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray-th    { fill: #2C2C2A; }
    .gray-ts    { fill: #444441; }
  </style>

  <text class="col-h" x="340" y="28" text-anchor="middle">Chain-callable methods</text>
  <text class="ts" x="340" y="44" text-anchor="middle">Each does its own access control</text>

  <rect class="coral-fill" x="30" y="64" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th coral-th" x="105" y="86" text-anchor="middle">Sales.buy</text>
  <text class="ts coral-ts" x="105" y="104" text-anchor="middle">player signs, pays</text>

  <rect class="purple-fill" x="200" y="64" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th purple-th" x="275" y="86" text-anchor="middle">UnitRegistry.transferUnit</text>
  <text class="ts purple-ts" x="275" y="104" text-anchor="middle">authority only</text>

  <rect class="purple-fill" x="370" y="64" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th purple-th" x="445" y="86" text-anchor="middle">Tax.chargeTax</text>
  <text class="ts purple-ts" x="445" y="104" text-anchor="middle">authority only</text>

  <rect class="amber-fill" x="540" y="64" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th amber-th" x="600" y="86" text-anchor="middle">Treasury</text>
  <text class="ts amber-ts" x="600" y="104" text-anchor="middle">mint, burn, etc</text>

  <line x1="105" y1="120" x2="180" y2="248" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <line x1="275" y1="120" x2="200" y2="248" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <line x1="445" y1="120" x2="480" y2="248" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <line x1="600" y1="120" x2="500" y2="248" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <text class="col-h" x="340" y="232" text-anchor="middle">Plain helpers (not chain-callable)</text>

  <rect class="teal-fill" x="60" y="248" width="260" height="80" rx="8" stroke-width="0.5"/>
  <text class="th teal-th" x="190" y="276" text-anchor="middle">performUnitTransfer</text>
  <text class="ts teal-ts" x="190" y="296" text-anchor="middle">in unitRegistry.ts</text>
  <text class="ts teal-ts" x="190" y="312" text-anchor="middle">Plain async function, no decorator</text>

  <rect class="teal-fill" x="360" y="248" width="260" height="80" rx="8" stroke-width="0.5"/>
  <text class="th teal-th" x="490" y="276" text-anchor="middle">ledger.record</text>
  <text class="ts teal-ts" x="490" y="296" text-anchor="middle">in ledger.ts</text>
  <text class="ts teal-ts" x="490" y="312" text-anchor="middle">Method, but @runtimeMethod removed</text>

  <rect class="gray-fill" x="40" y="368" width="600" height="60" rx="8" stroke-width="0.5"/>
  <text class="th gray-th" x="56" y="390">Why this is secure</text>
  <text class="ts gray-ts" x="56" y="408">Helpers have no chain path. A hostile signed tx cannot reach them.</text>
  <text class="ts gray-ts" x="56" y="422">Each chain-callable wrapper does its own access check before calling in.</text>
</svg>
